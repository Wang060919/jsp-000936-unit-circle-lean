name: Lean verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LEAN_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865 # v1
        with:
          auto-config: "false"
          build: "true"
          use-github-cache: "false"
          use-mathlib-cache: "true"
      - name: Audit target, public proofs and original statement
        run: python3 scripts/audit.py
      - name: Replay final theorem and imports in a fresh kernel environment
        run: timeout 600 lake env leanchecker --fresh -v UnitCircleInterpolation.FinalClassification
      - name: Verify packaged source identity
        run: python3 scripts/verify_manifest.py
